<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAZE</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0524; }
    canvas { display: block; }
    #hud {
      position: fixed; left: 18px; bottom: 16px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      color: #edeef4; font-size: 13px; line-height: 1.7;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      user-select: none; pointer-events: none;
    }
    #hud .speed { font-size: 34px; font-weight: 700; letter-spacing: 0.04em; color: #00f0ff; }
    #hud .speed span { font-size: 13px; color: #9ba0b4; letter-spacing: 0.18em; }
    #help {
      position: fixed; right: 18px; bottom: 16px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      color: #9ba0b4; font-size: 11.5px; line-height: 1.8; text-align: right;
      letter-spacing: 0.06em; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      user-select: none; pointer-events: none;
    }
    #help b { color: #edeef4; font-weight: 600; }
    #title {
      position: fixed; left: 18px; top: 14px;
      font-family: "Futura-CondensedExtraBold", "AvenirNextCondensed-Heavy", "Arial Narrow", Impact, sans-serif;
      color: #edeef4; font-size: 26px; letter-spacing: 0.14em;
      text-shadow: 0 0 18px rgba(255, 46, 136, 0.6);
      user-select: none; pointer-events: none;
    }
    #title small {
      display: block; font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 10px; color: #9ba0b4; letter-spacing: 0.28em; margin-top: 2px;
    }
    #campanel {
      position: fixed; right: 18px; top: 14px;
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      background: rgba(19, 21, 29, 0.78);
      border: 1px solid #262a38; border-radius: 6px;
      padding: 10px 12px 12px;
      user-select: none; min-width: 210px;
    }
    #campanel h4 {
      margin: 0 0 6px; font-size: 10px; font-weight: 600;
      color: #00f0ff; letter-spacing: 0.22em;
    }
    #cammeta {
      margin: 0; font-size: 11px; line-height: 1.65; color: #9ba0b4;
      white-space: pre;
    }
    #cammeta b { color: #edeef4; font-weight: 600; }
    #copycam {
      margin-top: 8px; width: 100%;
      font-family: inherit; font-size: 11px; letter-spacing: 0.1em;
      color: #0d0524; background: #00f0ff;
      border: none; border-radius: 4px; padding: 6px 0;
      cursor: pointer; font-weight: 700;
    }
    #copycam:hover { background: #7df9ff; }
    #copycam:focus-visible { outline: 2px solid #ff2e88; outline-offset: 2px; }
    #copycam.done { background: #ff2e88; color: #edeef4; }
    #loading {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px;
      background: linear-gradient(#0d0524, #1f0b3e);
      transition: opacity 0.5s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .load-title {
      font-family: "Futura-CondensedExtraBold", "AvenirNextCondensed-Heavy", "Arial Narrow", Impact, sans-serif;
      font-size: 64px; letter-spacing: 0.22em; color: #edeef4;
      text-shadow: 0 0 28px rgba(255, 46, 136, 0.7);
    }
    #loading .load-bar {
      width: 220px; height: 8px; border: 1px solid #262a38; border-radius: 3px;
      overflow: hidden; background: rgba(19, 21, 29, 0.7);
    }
    #loading .load-bar i {
      display: block; height: 100%; width: 40%;
      background: #00f0ff; border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
      animation: loadsweep 1.1s ease-in-out infinite;
    }
    @keyframes loadsweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(650%); }
    }
    #loading .load-sub {
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 11px; letter-spacing: 0.3em; color: #9ba0b4;
    }
    #paused {
      position: fixed; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(13, 5, 36, 0.45);
      pointer-events: none; user-select: none;
    }
    #paused.on { display: flex; }
    #paused span {
      font-family: "Futura-CondensedExtraBold", "AvenirNextCondensed-Heavy", "Arial Narrow", Impact, sans-serif;
      font-size: 64px; letter-spacing: 0.22em; color: #edeef4;
      text-shadow: 0 0 24px rgba(0, 240, 255, 0.8);
    }
    #paused small {
      display: block; text-align: center;
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 12px; letter-spacing: 0.24em; color: #9ba0b4; margin-top: 6px;
    }
    #boostwrap {
      width: 190px; height: 10px; margin: 6px 0 4px;
      border: 1px solid #262a38; border-radius: 3px;
      background: rgba(19, 21, 29, 0.7); overflow: hidden;
    }
    #boostfill {
      height: 100%; width: 50%;
      background: #00f0ff; border-radius: 2px;
      transition: width 0.1s linear;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
    }
    #boostfill.boosting { background: #ff2e88; box-shadow: 0 0 10px rgba(255, 46, 136, 0.8); }
    #trick {
      position: fixed; left: 50%; top: 24%;
      transform: translateX(-50%) scale(0.9);
      font-family: "Futura-CondensedExtraBold", "AvenirNextCondensed-Heavy", "Arial Narrow", Impact, sans-serif;
      font-size: 44px; letter-spacing: 0.14em; color: #00f0ff;
      text-shadow: 0 0 22px rgba(0, 240, 255, 0.8);
      opacity: 0; transition: opacity 0.25s, transform 0.25s;
      pointer-events: none; user-select: none; white-space: nowrap;
    }
    #trick.show { opacity: 1; transform: translateX(-50%) scale(1); }
    #trick.sketchy { color: #ffb800; text-shadow: 0 0 22px rgba(255, 184, 0, 0.8); }
    #trick.bail { color: #ff2e88; text-shadow: 0 0 22px rgba(255, 46, 136, 0.8); }
    #trick small {
      display: block; text-align: center;
      font-family: "SF Mono", ui-monospace, Menlo, monospace;
      font-size: 15px; letter-spacing: 0.3em; color: #edeef4;
    }
    #pose {
      position: fixed; left: 50%; top: 14px;
      transform: translateX(-50%);
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px; letter-spacing: 0.18em; color: #0d0524;
      background: #ff2e88; border-radius: 4px; padding: 6px 14px;
      text-shadow: none; box-shadow: 0 0 16px rgba(255, 46, 136, 0.6);
      opacity: 0; transition: opacity 0.2s;
      pointer-events: none; user-select: none; white-space: nowrap;
    }
    #pose.on { opacity: 1; }
  </style>
</head>
<body>
  <div id="title">RAZE<small>GRIDFIRE SANDBOX 0.1</small></div>
  <div id="hud">
    <div class="speed"><span id="speed">0</span><span> KM/H</span></div>
    <div id="boostwrap"><div id="boostfill"></div></div>
    <div id="time">--</div>
    <div id="fps">-- fps</div>
  </div>
  <div id="help">
    <b>W/S</b> thrust · <b>A/D</b> carve &amp; spin<br />
    <b>SHIFT</b> boost (meter) · <b>SPACE</b> jump / hold = grab<br />
    <b>DRAG</b> orbit · <b>WHEEL</b> zoom<br />
    <b>V</b> cam mode · <b>C</b> reset cam<br />
    <b>P</b> pause · <b>R</b> reset rider<br />
    <b>1-7</b> pose preview · <b>0</b> exit preview
  </div>
  <div id="paused"><div><span>PAUSED</span><small>P TO RESUME · CAMERA STILL LIVE</small></div></div>
  <div id="trick"></div>
  <div id="pose"></div>
  <div id="campanel">
    <h4>CAMERA</h4>
    <pre id="cammeta">--</pre>
    <button id="copycam" type="button">COPY METADATA</button>
  </div>
  <div id="loading">
    <div class="load-title">RAZE</div>
    <div class="load-bar"><i></i></div>
    <div class="load-sub">BOOTING GRIDFIRE…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <!-- Cloudflare Web Analytics (shared dwightexmachina.github.io beacon;
       filter the dashboard by /raze/ — see eartrainer/ANALYTICS.md) -->

  <!-- End Cloudflare Web Analytics -->
</body>
</html>
